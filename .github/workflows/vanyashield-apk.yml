name: Build VanyaShield APK
on:
  push:
    branches: [vanyashield-android-build]
    paths:
      - 'VanyaShield_Android_App/**'
      - '.github/workflows/vanyashield-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: VanyaShield_Android_App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VanyaShield-Android-debug-apk
          path: VanyaShield_Android_App/app/build/outputs/apk/debug/app-debug.apk