name: Build debug APK

# Собирает .apk при каждом пуше в main и по кнопке "Run workflow" вручную.
# В репозитории нет закоммиченного gradle-wrapper (gradlew/gradlew.bat) —
# Android Studio генерирует его сама при первом открытии проекта, поэтому
# здесь ставим Gradle явно через setup-gradle и вызываем `gradle` напрямую,
# а не `./gradlew`. Если позже добавите wrapper в репозиторий — замените
# `gradle assembleDebug` на `./gradlew assembleDebug` для консистентности
# с локальной сборкой.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses and install SDK platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Write local.properties (sdk.dir only — секреты НЕ коммитим)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Test model preparation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Prepare offline Russian speech model
        run: python3 scripts/prepare_vosk_model.py

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify model assets in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/model-ru-small/uuid'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/model-ru-small/am/final.mdl'
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F "lib/$abi/libjnidispatch.so"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voiceagent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build separate recovery APK
        run: gradle assembleRecovery --stacktrace

      - name: Verify recovery native libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l app/build/outputs/apk/recovery/app-recovery.apk | grep -F "lib/$abi/libjnidispatch.so"
          done

      - name: Upload separate recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: voiceagent-recovery-apk
          path: app/build/outputs/apk/recovery/app-recovery.apk
          if-no-files-found: error


  smoke:
    name: Launch on Android emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: voiceagent-debug-apk
          path: smoke-apk
      - uses: actions/download-artifact@v4
        with:
          name: voiceagent-recovery-apk
          path: recovery-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch application and check registration-free settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            python3 scripts/android_smoke.py smoke-apk/app-debug.apk
            VOICEAGENT_PACKAGE=com.voiceagent.oneplus13.accesscheck python3 scripts/android_smoke.py recovery-apk/app-recovery.apk
            adb shell run-as com.voiceagent.oneplus13 ls files/smoke_data_kept
